[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "gesture-relay-backend-a"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.115,<1", "pydantic>=2.10,<3", "pydantic-settings>=2.7,<3",
  "python-multipart>=0.0.20,<1", "uvicorn>=0.34,<1",
  "google-cloud-firestore>=2.20,<3", "google-cloud-storage>=3,<4",
  "google-cloud-tasks>=2.19,<3", "firebase-admin>=6.6,<8", "av>=18.1,<19",
  "google-genai>=1.0",
]

[project.optional-dependencies]
dev = ["pytest>=8,<10", "pytest-asyncio>=0.23", "httpx>=0.28,<1", "ruff>=0.11,<1"]

[dependency-groups]
dev = ["pytest>=8,<10", "pytest-asyncio>=0.23", "httpx>=0.28,<1", "ruff>=0.11,<1"]

[tool.setuptools.packages.find]
include = ["api*", "common*", "backend_a*", "worker*", "data"]

[tool.setuptools.package-data]
data = ["odai.json"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
ignore = ["E501", "B008"]
